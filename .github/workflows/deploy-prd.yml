name: Deploy production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-web

      - uses: darwinia-network/devops/actions/smart-vercel@main
        name: Deploy to Vercel
        id: vercel
        with:
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_group: itering
          preview_output: true
          script_run: false
          dist_path: web-deploy
          project_name: msgscan
          prod_mode: true
          enable_cache: true

      - name: Notify Slack of deployment
        uses: rtCamp/action-slack-notify@v2
        continue-on-error: true
        env:
          SLACK_CHANNEL: public-msgport
          SLACK_COLOR: success
          SLACK_ICON: https://avatars.githubusercontent.com/u/14985020?s=48&v=4
          SLACK_MESSAGE: ${{ steps.vercel.outputs.PREVIEW_LINK }}
          SLACK_TITLE: Preview
          SLACK_USERNAME: Vercel
          SLACK_WEBHOOK: ${{ secrets.SLACK_INCOMING_WEBHOOK_URL }}
